<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChainRadar Local RAG Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px 24px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 18px; font-weight: 600; color: #38bdf8; }
    header span { font-size: 12px; color: #10b981; background: #064e3b; padding: 4px 10px; border-radius: 999px; }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 14.5px;
      max-width: 82%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 3px;
    }
    .assistant {
      align-self: flex-start;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-bottom-left-radius: 3px;
    }
    .chips {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip:hover { border-color: #38bdf8; color: #e2e8f0; }
    form {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 24px 20px;
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #111827;
      color: #f8fafc;
      font-size: 14.5px;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    button {
      padding: 0 22px;
      border-radius: 10px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>ChainRadar Local RAG Assistant</h1>
    <span>● Self-Running (Ollama + Qwen 2.5 + Nomic Embed)</span>
  </header>

  <div id="chat-box">
    <div class="msg assistant">Ask me how to navigate ChainRadar, which blockchain investigation tool to use, or how the 5 case studies work.</div>
  </div>

  <div class="chips">
    <span class="chip" onclick="sendQuick('Where do I go to check USDT transfers on TRON?')">Track USDT on TRON</span>
    <span class="chip" onclick="sendQuick('Why is the Wallet Activity Tracer locked on my account?')">Unlock Wallet Tracer</span>
    <span class="chip" onclick="sendQuick('How do I use checklists without creating a case?')">Using Checklists</span>
    <span class="chip" onclick="sendQuick('Tell me about WWE')">Test Out-of-Scope Refusal</span>
  </div>

  <form id="chat-form">
    <input id="user-input" type="text" placeholder="Ask about ChainRadar routes, tools, or workflows..." autocomplete="off" required />
    <button id="send-btn" type="submit">Send</button>
  </form>

  <script>
    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const btn = document.getElementById('send-btn');

    function formatReply(text) {
      let safe = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return safe
        .replace(/^#{1,6}\s+(.*)$/gm, '<strong style="display:block; margin-top:8px; color:#38bdf8; font-size:15.5px;">$1</strong>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code style="background:#0f172a; padding:2px 6px; border-radius:4px; color:#7dd3fc;">$1</code>')
        .replace(/^---\s*$/gm, '<hr style="border:none; border-top:1px solid #334155; margin:8px 0;" />')
        .replace(/^\s*\*\s+/gm, '• ');
    }

    function appendMessage(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      if (cls === 'assistant') {
        div.innerHTML = formatReply(text);
      } else {
        div.textContent = text;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function sendQuick(text) {
      input.value = text;
      form.requestSubmit();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      btn.disabled = true;
      appendMessage(text, 'user');

      const loadingDiv = appendMessage('Thinking...', 'assistant');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text }),
        });
        const data = await res.json();
        const reply = data.reply || data.error || 'Error obtaining response.';
        loadingDiv.innerHTML = formatReply(reply);
      } catch (err) {
        loadingDiv.textContent = 'Connection error: Is Ollama running?';
      } finally {
        btn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
